[project]
name = "trackprep"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beat_this @ https://github.com/CPJKU/beat_this/archive/main.zip",
    "einops",
    "librosa",
    "matplotlib",
    "mutagen",
    "numpy",
    "rotary-embedding-torch",
    "soundfile",
    "soxr",
    "torch",
    "torchaudio",
]

[project.scripts]
trackprep = "trackprep.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["trackprep"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
